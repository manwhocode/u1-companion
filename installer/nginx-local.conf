# U1 Companion HTTPS, provisioning and optional Alexa login. Owned file.
server {
    listen 443 ssl;
    server_name _;
    absolute_redirect off;
    port_in_redirect off;
    ssl_certificate /home/lava/u1-addons/filament-ui/tls/server.crt;
    ssl_certificate_key /home/lava/u1-addons/filament-ui/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location = / { return 302 /u1-filaments-ui/#/u1-filaments; }
    location /u1-ai/api/ {
        proxy_pass http://127.0.0.1:4547;
        proxy_set_header X-U1-Origin "https://$http_host";
        proxy_set_header X-U1-AI-Session $http_x_u1_ai_session;
        proxy_set_header Origin $http_origin;
        proxy_set_header Referer $http_referer;
        proxy_read_timeout 60s;
        client_max_body_size 128k;
    }
    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Origin http://127.0.0.1;
        proxy_set_header X-Real-IP 127.0.0.1;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }
}
server {
    listen 8081;
    server_name _;
    location = /U1-Camera.mobileconfig { alias /home/lava/fluidd/u1-filaments-ui/U1-Camera.mobileconfig; default_type application/x-apple-aspen-config; }
    location = /u1-local-ca.crt { alias /home/lava/fluidd/u1-filaments-ui/u1-local-ca.crt; default_type application/x-x509-ca-cert; }
    location / { return 404; }
}
# ALEXA LOGIN
server {
    listen 3443 ssl;
    server_name _;
    ssl_certificate /home/lava/u1-addons/filament-ui/tls/server.crt;
    ssl_certificate_key /home/lava/u1-addons/filament-ui/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:3457;
        proxy_set_header Host $host:$server_port;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }
}
