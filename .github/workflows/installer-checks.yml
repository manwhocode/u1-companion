name: SSH installer checks
on:
  push:
    paths: ['installer/**', 'desktop/**', 'alexa/**', 'alexa-skill/**', 'backend/**', 'frontend/**', 'remote-access/nginx-template.conf', 'install.sh', 'services/**', '.github/workflows/installer-checks.yml']
  pull_request:
    paths: ['installer/**', 'desktop/**', 'alexa/**', 'alexa-skill/**', 'backend/**', 'frontend/**', 'remote-access/nginx-template.conf', 'install.sh', 'services/**', '.github/workflows/installer-checks.yml']
permissions:
  contents: read
jobs:
  simulated-installation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s installer/tests -v
      - run: python -m unittest test-u1-bed-calibration.py test-u1-maintenance.py test-u1-calibration-jobs.py
        working-directory: backend
      - run: python -m unittest test-u1-purchase-and-dryer.py test-u1-dryer.py test-u1-data-store.py test-spool-accounting.py
        working-directory: backend
      - run: python backend/test-u1-timed-pause.py
        env:
          PYTHONPATH: backend
      - run: node --test alexa/events.test.cjs alexa/speech.test.cjs alexa/speech-settings.test.cjs
      - run: sh -n install.sh && sh -n services/S96u1-remote && sh -n services/S97u1-ai && sh -n services/S98u1-spool-accounting && sh -n services/S99u1-alexa-bridge
