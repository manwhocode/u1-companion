# U1 Companion optional remote gateway. Only cloudflared can reach loopback.
map "$request_method:$http_origin" $u1_remote_missing_origin {
    default 0;
    ~^(POST|PUT|PATCH|DELETE):$ 1;
}
server {
    listen 127.0.0.1:18088;
    server_name _;
    absolute_redirect off;
    port_in_redirect off;
    access_log off;
    error_log /var/log/nginx/u1-remote-error.log warn;
    client_max_body_size 0;
    auth_request /__u1_remote_authorize;
    add_header X-U1-Remote-Gateway code-v1 always;
    if ($u1_remote_missing_origin) { return 403; }
    location = /__u1_remote_authorize {
        internal;
        auth_request off;
        proxy_pass http://127.0.0.1:4548/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-U1-Remote-Key "__CONTROL_KEY__";
        proxy_set_header X-U1-Remote-Origin $http_origin;
        proxy_set_header X-U1-Remote-Host $http_host;
        proxy_set_header X-U1-Remote-Cookie $http_cookie;
    }
    location = /u1-remote/login {
        auth_request off;
        client_max_body_size 2k;
        proxy_pass http://127.0.0.1:4548/login;
        proxy_set_header X-U1-Remote-Key "__CONTROL_KEY__";
        proxy_set_header X-U1-Remote-Host $http_host;
        proxy_set_header X-U1-Remote-Origin $http_origin;
        proxy_set_header X-U1-Remote-IP $http_cf_connecting_ip;
    }
    location = /u1-remote/logout {
        auth_request off;
        proxy_pass http://127.0.0.1:4548/logout;
        proxy_set_header X-U1-Remote-Key "__CONTROL_KEY__";
        proxy_set_header X-U1-Remote-Host $http_host;
        proxy_set_header X-U1-Remote-Origin $http_origin;
        proxy_set_header X-U1-Remote-Cookie $http_cookie;
    }
    location @u1_remote_login { return 302 /u1-remote/login; }
    location = / { return 302 /u1-remote/open; }
    location /u1-filaments-ui/ {
        error_page 401 = @u1_remote_login;
        proxy_pass http://127.0.0.1:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP 127.0.0.1;
        proxy_set_header X-Forwarded-For 127.0.0.1;
    }
    location = /u1-remote/open {
        error_page 401 = @u1_remote_login;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        alias /home/lava/u1-addons/filament-ui/remote-entry.html;
    }
    location = /u1-remote/check {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        alias /home/lava/u1-addons/filament-ui/remote-config.json;
    }
    location = /u1-remote/session {
        proxy_pass http://127.0.0.1:4548/session;
        proxy_set_header X-U1-Remote-Key "__CONTROL_KEY__";
        proxy_set_header X-U1-Remote-Origin $http_origin;
        proxy_set_header X-U1-Remote-Host $http_host;
        proxy_set_header X-U1-Remote-Cookie $http_cookie;
        add_header Cache-Control "no-store" always;
    }
    location = /websocket {
        # Browser authentication is enforced by the gateway cookie. The relay
        # is a loopback control endpoint; normalize Fluidd oneshot query args.
        set $args "";
        proxy_pass http://127.0.0.1:4548/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-U1-Remote-Key "__CONTROL_KEY__";
        proxy_set_header X-U1-Remote-Host $http_host;
        proxy_set_header X-U1-Remote-Origin $http_origin;
        proxy_set_header X-U1-Remote-Cookie $http_cookie;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
    location /u1-ai/api/ {
        proxy_pass http://127.0.0.1:4547;
        proxy_set_header Host $http_host;
        proxy_set_header X-U1-Origin "https://$http_host";
        proxy_set_header X-U1-AI-Session $http_x_u1_ai_session;
        proxy_set_header Origin $http_origin;
        proxy_set_header Referer $http_referer;
        proxy_read_timeout 60s;
        client_max_body_size 128k;
    }
    location = /u1-filaments-ui/sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        alias /home/lava/u1-addons/filament-ui/remote-sw.js;
    }
    location = /u1-filaments-ui/config.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        alias /home/lava/u1-addons/filament-ui/remote-config.json;
    }
    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Origin http://127.0.0.1;
        proxy_set_header X-Real-IP 127.0.0.1;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 86400;
        proxy_redirect http://127.0.0.1/ /;
    }
}
